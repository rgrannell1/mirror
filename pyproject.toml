[project]
name = "mirror"
version = "0.1.0"
description = "Media asset management and publishing workflow engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "boto3",
  "botocore",
  "dateparser",
  "ffmpeg-python",
  "imagehash",
  "jsonschema",
  "levenshtein",
  "numpy",
  "opencv-python",
  "Pillow>=12.0.0",
  "python-dotenv",
  "PyYAML",
  "requests",
  "sqlean.py",
  "xmltodict",
  "markdown",
  "tomli-w",
  "typeguard",
  "feedgen",
  "psutil",
  "zahir",
  "bookman",
  "tertius",
  "orbis",
  "textual>=8.2.3",
  "rich-pixels>=3.0.1",
  "textual-image>=0.11.0",
  "google-genai",
  "pyshacl>=0.40.0",
  "rdflib>=7.6.0",
  "dulwich>=1.2.12",
  "transformers>=5.14.1",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "thumbhash>=0.1.2",
  "funes",
]

[project.scripts]
mirror = "mirror.cli:main"

[project.optional-dependencies]
dev = [
  "vulture",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No GPU on this machine: install CPU-only torch wheels, avoiding the CUDA downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
tertius = { path = "../tertius", editable = true }
orbis = { path = "../orbis", editable = true }
bookman = { path = "../bookman", editable = true }
zahir = { path = "../zahir", editable = true }
funes = { path = "../funes", editable = true }

[tool.pytest.ini_options]
# src-layout: let tests import `mirror` without an editable install step
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
preview = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "BLE", "SIM", "RUF", "PLR", "PLC", "C"]
# B901 flags zahir jobs, which must end with `return result` then a bare `yield`.
ignore = ["B901"]

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal expected values — magic-value checks add noise.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.pylint]
max-statements = 14
max-args = 4

[tool.ruff.lint.mccabe]
max-complexity = 7
